<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pumpkin Season — Build 1</title><style>@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap');:root{--sage:#829478;--deep:#3f493a;--cream:#f5eddc;--brown:#60483a;--terr:#a96d4f}*{box-sizing:border-box}body{margin:0;background:#d8d0bd;font-family:Nunito,sans-serif;color:var(--deep)}button{font:inherit}.game{width:min(100%,900px);margin:auto;background:var(--cream);min-height:100vh;overflow:hidden}header{padding:14px 16px 10px;background:#f5eddc;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #c8bca5}.brand{font-family:"Baloo 2";font-size:29px;font-weight:700;line-height:1;color:#5b493c}.brand small{display:block;font:700 12px Nunito;color:#78856c;letter-spacing:.12em;text-transform:uppercase}.stats{display:flex;gap:8px}.pill{background:#fff8e9;border:2px solid #c8b99e;border-radius:18px;padding:7px 11px;font-weight:800;box-shadow:0 2px 0 #b8a991}.scene{position:relative;background:#8da080;aspect-ratio:1.55}.scene>img{width:100%;height:100%;display:block;object-fit:cover}.plot{position:absolute;width:16.8%;height:16.2%;background:transparent;border:0;cursor:pointer;border-radius:16px}.p1{left:12.3%;top:21.5%}.p2{left:32.3%;top:21.5%}.p3{left:12.3%;top:40.8%}.p4{left:32.3%;top:40.8%}.plot:focus-visible{outline:4px solid #f4e4ae}.crop{position:absolute;width:15%;height:15%;object-fit:contain;pointer-events:none;display:none;filter:drop-shadow(0 3px 2px #4b493d55)}.controls{padding:12px 14px;background:#f1e5d1;border-top:2px solid #c5b69d}.panel{background:#fff8ea;border:2px solid #c9baa1;border-radius:20px;padding:12px;box-shadow:0 4px 0 #c1b39d}.actionrow{display:flex;gap:8px;flex-wrap:wrap}.action{flex:1;min-width:130px;border:2px solid #6d7d64;background:#87997b;color:#fff8e9;border-radius:15px;padding:11px 14px;box-shadow:0 3px 0 #56654f;cursor:pointer;font-weight:800}.action.secondary{background:#9a765b;border-color:#735541;box-shadow:0 3px 0 #5a4235}.action:active{transform:translateY(2px);box-shadow:0 1px 0 #4d5948}.help{margin:8px 0 0;color:#756b5b;font-size:13px}.log{font-size:13px;margin-top:8px;color:#655c4f;min-height:18px}.day{font-family:"Baloo 2";font-size:19px;color:#5c493b}.day span{color:#7b896e}@media(max-width:560px){header{padding:12px}.brand{font-size:25px}.pill{padding:6px 9px;font-size:13px}.controls{padding:9px}.panel{padding:10px}.action{min-width:115px;padding:10px 8px}.help{font-size:12px}}</style></head><body><main class="game"><header><div class="brand">Pumpkin Season<small>Build 1 · Autumn Acres</small></div><div class="stats"><div class="pill">Day <span id="day">1</span></div><div class="pill">✦ <span id="coins">30</span></div></div></header><section class="scene" aria-label="Your autumn farm"><img src="assets/farm.svg" alt="Whimsical autumn farm with four garden plots"><button class="plot p1" data-plot="0" aria-label="Garden plot 1"></button><button class="plot p2" data-plot="1" aria-label="Garden plot 2"></button><button class="plot p3" data-plot="2" aria-label="Garden plot 3"></button><button class="plot p4" data-plot="3" aria-label="Garden plot 4"></button><img class="crop c0" src="assets/seedling.svg" alt=""><img class="crop c1" src="assets/seedling.svg" alt=""><img class="crop c2" src="assets/seedling.svg" alt=""><img class="crop c3" src="assets/seedling.svg" alt=""></section><section class="controls"><div class="panel"><div class="day">Autumn morning <span>· Choose a plot</span></div><div class="actionrow"><button class="action" id="plant">Plant pumpkin seed · 3 coins</button><button class="action secondary" id="water">Water all planted crops</button><button class="action secondary" id="sleep">End day</button></div><div class="help">Tap a plot, then plant it. Watered crops grow when you end the day. Mature pumpkins can be harvested for 9 coins.</div><div class="log" id="log" aria-live="polite">Your little farm is ready for its first autumn.</div></div></section></main><script>const plots=[{stage:0,water:false},{stage:0,water:false},{stage:0,water:false},{stage:0,water:false}];let selected=0,coins=30,day=1;const dayEl=document.getElementById('day'),coinEl=document.getElementById('coins'),log=document.getElementById('log'),crops=[...document.querySelectorAll('.crop')];function render(){dayEl.textContent=day;coinEl.textContent=coins;plots.forEach((p,i)=>{const el=crops[i];el.style.display=p.stage?'block':'none';el.src=p.stage>=3?'assets/pumpkin.svg':'assets/seedling.svg';const pos=[[12.5,21],[32.5,21],[12.5,40],[32.5,40]][i];el.style.left=pos[0]+'%';el.style.top=pos[1]+'%';});}document.querySelectorAll('.plot').forEach(b=>b.addEventListener('click',()=>{selected=+b.dataset.plot;const p=plots[selected];log.textContent=p.stage===0?'Plot '+(selected+1)+' is ready for a pumpkin seed.':p.stage>=3?'Your pumpkin is ready to harvest! Tap Plant to harvest it.':p.water?'Plot '+(selected+1)+' is watered and growing.':'Plot '+(selected+1)+' needs water before the day ends.';}));document.getElementById('plant').addEventListener('click',()=>{const p=plots[selected];if(p.stage===0){if(coins<3){log.textContent='Not enough coins for a seed.';return}coins-=3;p.stage=1;p.water=false;log.textContent='A tiny pumpkin seed is tucked into plot '+(selected+1)+'.';}else if(p.stage>=3){coins+=9;p.stage=0;p.water=false;log.textContent='Harvested a plump pumpkin! +9 coins.';}else log.textContent='That pumpkin is still growing. Water it, then end the day.';render();});document.getElementById('water').addEventListener('click',()=>{let n=0;plots.forEach(p=>{if(p.stage>0&&p.stage<3&&!p.water){p.water=true;n++;}});log.textContent=n?'You watered '+n+' growing crop'+(n===1?'':'s')+'.':'Nothing needed watering right now.';render();});document.getElementById('sleep').addEventListener('click',()=>{let n=0;plots.forEach(p=>{if(p.stage>0&&p.stage<3){if(p.water){p.stage++;n++;}p.water=false;}});day++;log.textContent=n?'A new autumn morning. '+n+' crop'+(n===1?'':'s')+' grew overnight.':'A new autumn morning. Remember to plant and water.';render();});render();</script></body></html>
