<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>October</title><style>
:root{--g:#475e4d;--b:#705e49;--gd:#2f4034;--g2:#5e7563;--c:#e4ddd1;--p:#d6ccbc;--i:#302b25}*{box-sizing:border-box}body{margin:0;background:var(--gd);color:var(--i);font:14px ui-monospace,monospace}button{font:inherit;cursor:pointer}#app{max-width:760px;margin:auto;min-height:100vh;background:var(--p)}.leaves{height:58px;background:var(--gd);overflow:hidden;position:relative}.leaf{position:absolute;width:11px;height:17px;background:var(--b);border-radius:100% 0;opacity:.65;animation:fall 6s linear infinite}.leaf:nth-child(1){left:8%;animation-delay:-1s}.leaf:nth-child(2){left:27%;animation-delay:-4s}.leaf:nth-child(3){left:49%;animation-delay:-2s}.leaf:nth-child(4){left:72%;animation-delay:-5s}.leaf:nth-child(5){left:91%;animation-delay:-3s}@keyframes fall{from{transform:translateY(-25px) rotate(0)}to{transform:translate(55px,75px) rotate(250deg)}}.home{min-height:calc(100vh - 58px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:28px;background:linear-gradient(#475e4d,#3d5142);color:var(--c)}.logo{font:64px Georgia,serif;letter-spacing:.1em}.tag{margin:10px 0 34px}.home button{width:min(360px,100%);margin:8px auto;padding:16px;border:1px solid #93836e;border-radius:9px;background:var(--p)}header{background:var(--gd);color:var(--c);padding:18px}.brand{font:32px Georgia,serif}.sub{font-size:11px;opacity:.75}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.stat{padding:8px;border:1px solid #718575;border-radius:7px;font-size:9px}.stat b{display:block;font-size:12px;margin-top:3px}.bar{height:6px;background:#2f4034;border-radius:6px;margin-top:5px;overflow:hidden}.fill{height:100%;background:#89998d}main{padding:14px}.panel{background:var(--c);border:1px solid #93836e;border-radius:12px;padding:17px;min-height:330px}.title{font:27px Georgia,serif;color:var(--gd)}.small{font-size:11px;color:var(--b)}.line{height:1px;background:#93836e;margin:14px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{min-height:55px;padding:10px;border:1px solid var(--g);border-radius:8px;background:#f0e9df;text-align:left}.btn:hover{background:#c4cfc5}.btn strong{display:block;color:var(--gd);font-size:12px}.btn span{font-size:10px;color:var(--b)}.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #93836e}.nav button{border:0;padding:13px 2px;background:var(--p);font-size:9px}.nav .active{background:var(--g);color:var(--c)}.room{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}.bedroom{height:240px;background:linear-gradient(#89998d 0 48%,#806e58 48%);border:2px solid var(--gd);border-radius:9px;position:relative;overflow:hidden}.window{position:absolute;right:16px;top:18px;width:82px;height:70px;background:#475e4d;border:6px solid #705e49}.window:after{content:"";position:absolute;left:39px;top:0;bottom:0;border-left:3px solid #d6ccbc}.bed{position:absolute;left:18px;bottom:28px;width:125px;height:63px;background:#705e49;border:3px solid #514536;border-radius:7px}.bed:before{content:"";position:absolute;left:8px;top:8px;width:47px;height:25px;background:#d6ccbc;border-radius:4px}.desk{position:absolute;right:14px;bottom:30px;width:83px;height:53px;background:#514536;border-top:9px solid #93836e}.pumpkins{position:absolute;left:155px;bottom:25px;display:flex;gap:7px;align-items:end}.pumpkin{width:42px;height:32px;border-radius:48%;background:#806e58;position:relative;box-shadow:inset 8px 0 #705e49,inset -8px 0 #93836e}.pumpkin:before{content:"";position:absolute;width:7px;height:9px;background:#475e4d;left:18px;top:-7px;border-radius:3px}.pumpkin.big{width:54px;height:40px}.pumpkin.small{width:31px;height:24px}.task{padding:10px;border-left:3px solid var(--b);background:var(--p);margin:8px 0;font-size:11px}@media(max-width:500px){.logo{font-size:45px}.stats{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}.room{grid-template-columns:1fr}}
</style></head><body><div id="app"><div class="leaves"><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i></div><div id="root"></div></div><script>
const S={screen:'home',time:992,money:38,energy:72,mood:55,cozy:42,social:35,luck:50,focus:54,coffee:false,pumpkin:false,leaves:0,journal:['October 7 — The first cold afternoon.']};const R=document.querySelector('#root');
function tm(){let h=Math.floor(S.time/60)%24,m=S.time%60,a=h>=12?'PM':'AM';return(h%12||12)+':'+String(m).padStart(2,'0')+' '+a}function bar(n){return '<div class=bar><div class=fill style="width:'+n+'%"></div></div>'}function head(){return '<header><div class=brand>OCTOBER</div><div class=sub>MAPLEWOOD · OCTOBER 07</div><div class=stats>'+[['ENERGY',S.energy],['MOOD',S.mood],['COZY',S.cozy],['SOCIAL',S.social]].map(x=>'<div class=stat>'+x[0]+'<b>'+Math.round(x[1])+'</b>'+bar(x[1])+'</div>').join('')+'</div><div class=sub style="margin-top:10px">'+tm()+' · $'+S.money+' · LUCK '+Math.round(S.luck)+'</div></header>'}function btn(a,b,f){return '<button class=btn onclick="'+f+'"><strong>'+a+'</strong><span>'+b+'</span></button>'}function nav(){return '<nav class=nav>'+['HOME','EXPLORE','PHONE','BAG','JOURNAL'].map(x=>'<button class="'+(S.screen.toUpperCase()==x?'active':'')+'" onclick="go(\''+x.toLowerCase()+'\')">'+x+'</button>').join('')+'</nav>'}function shell(t,s,b){R.innerHTML=head()+'<main><section class=panel><div class=title>'+t+'</div><div class=small>'+s+'</div><div class=line></div>'+b+'</section></main>'+nav()}function go(x){S.screen=x;render()}function spend(e,m){S.energy=Math.max(0,S.energy-e*7);S.time=Math.min(1439,S.time+m)}
function home(){shell('Home','Your fall bedroom, kitchen, and porch.','<div class=room><div class=bedroom><div class=window></div><div class=bed></div><div class=desk></div><div class=pumpkins><div class="pumpkin small"></div><div class=pumpkin></div><div class="pumpkin big"></div></div></div><div><div class=task><b>BEDROOM</b><br>Take care of yourself and change your stats.</div><div class=actions>'+btn('REST','+18 energy, +8 cozy','rest()')+btn('JOURNAL','+8 focus, +5 mood','jact()')+btn('WINDOW','+6 mood, +4 cozy','win()')+btn('DESK','+12 focus, earn $3','desk()')+'</div></div></div>')}function rest(){S.energy=Math.min(100,S.energy+18);S.cozy=Math.min(100,S.cozy+8);S.time+=45;S.journal.push('Rested in the bedroom.');render()}function jact(){S.focus=Math.min(100,S.focus+8);S.mood=Math.min(100,S.mood+5);S.time+=20;S.journal.push('Wrote in the journal.');render()}function win(){S.mood=Math.min(100,S.mood+6);S.cozy=Math.min(100,S.cozy+4);S.journal.push('Watched leaves fall outside.');render()}function desk(){S.focus=Math.min(100,S.focus+12);S.energy=Math.max(0,S.energy-5);S.money+=3;S.journal.push('Finished a task at the desk and earned $3.');render()}
function explore(){shell('Explore','No map. Choose where the day takes you.','<div class=actions>'+btn('COFFEE SHOP','$5 · timing mini-game','coffee()')+btn('MAPLE PARK','Walk + collect leaves','park()')+btn('PUMPKIN FARM','$3 · pick a pumpkin','farm()')+btn('DOWNTOWN','Thrift, diner, cinema','town()')+btn('WOODS','Quiet trail · mystery','woods()')+btn('HOME','Return home','go(\'home\')')+'</div>')}function coffee(){if(S.money<5)return alert('You need $5.');S.money-=5;spend(1,35);R.innerHTML=head()+'<main><section class=panel><div class=title>The Little Acorn</div><div class=small>5:07 PM · warm windows · rain starting</div><div class=line></div><p>Stop the pour inside the green zone.</p><div style="height:20px;background:#705e49;border-radius:10px;position:relative;margin:25px 0"><div style="position:absolute;left:42%;right:42%;top:0;bottom:0;background:#475e4d"></div><div id=meter style="position:absolute;left:0;top:-8px;width:5px;height:36px;background:#2f4034"></div></div><button class=btn style=width:100% onclick=stopCoffee()><strong>STOP</strong><span>time it carefully</span></button></section></main>';let x=0,d=1;window.iv=setInterval(()=>{x+=d*2;if(x>95||x<0)d*=-1;document.querySelector('#meter').style.left=x+'%'},30);window.cx=()=>x}function stopCoffee(){clearInterval(window.iv);S.coffee=true;S.mood=Math.min(100,S.mood+8);S.cozy=Math.min(100,S.cozy+12);S.journal.push('Got coffee at The Little Acorn.');render()}function park(){spend(1,30);S.leaves++;S.mood=Math.min(100,S.mood+8);S.cozy=Math.min(100,S.cozy+4);S.luck=Math.min(100,S.luck+2);S.journal.push('Walked through Maple Park and collected a leaf.');render()}function farm(){if(S.money<3)return alert('You need $3.');S.money-=3;spend(1,45);S.pumpkin=true;S.cozy=Math.min(100,S.cozy+10);S.journal.push('Picked a lopsided pumpkin.');render()}function town(){spend(1,40);S.social=Math.min(100,S.social+7);S.money+=5;S.mood=Math.min(100,S.mood+5);S.journal.push('Spent time downtown.');render()}function woods(){spend(1,50);S.luck=Math.min(100,S.luck+5);S.mood=Math.min(100,S.mood+4);S.journal.push(S.time>1080?'Found a folded note: COME BACK ON THE 17TH.':'Walked the quiet woods.');render()}
function phone(){shell('Phone','Messages, weather, notes, and music.','<div class=actions>'+btn('MESSAGES','Jamie · one new text','msg()')+btn('WEATHER','51°F · cloudy · rain later','weather()')+btn('MUSIC','Quiet fall playlist','music()')+btn('NOTES','Private notes','notes()')+'</div>')}function msg(){S.social=Math.min(100,S.social+5);S.journal.push('Texted Jamie about tonight.');alert('JAMIE: “you doing anything tonight?”');render()}function weather(){alert('Tonight: colder, cloudy, 63% chance of rain.')}function music(){S.mood=Math.min(100,S.mood+5);S.cozy=Math.min(100,S.cozy+3);render()}function notes(){alert(S.journal.length+' journal entries so far.')}function bag(){shell('Bag','Things you have collected.','<div class=task>Coffee: '+(S.coffee?'YES':'—')+'</div><div class=task>Pumpkin: '+(S.pumpkin?'YES':'—')+'</div><div class=task>Leaves: '+S.leaves+'</div>')}function journal(){shell('Journal','Your October.',S.journal.map((x,i)=>'<div class=task><b>0'+(i+1)+'</b> '+x+'</div>').join(''))}function render(){if(S.screen=='home')home();else if(S.screen=='explore')explore();else if(S.screen=='phone')phone();else if(S.screen=='bag')bag();else journal()}R.innerHTML='<section class=home><div class=logo>OCTOBER</div><div class=tag>a small fall life</div><button onclick="go(\'home\')">START OCTOBER</button><button onclick="alert(\'A small fall-life game. Explore, take care of yourself, collect things, and uncover October.\')">ABOUT</button></section>';
</script></body></html>'''
