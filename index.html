<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pumpkin Patch & Fall Festival</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game-shell" aria-label="Pumpkin Patch and Fall Festival game">
    <canvas id="game" width="960" height="540"></canvas>

    <section class="hud" aria-live="polite">
      <div class="hud-card">
        <span class="hud-label">Day</span>
        <strong id="day-value">1</strong>
      </div>
      <div class="hud-card">
        <span class="hud-label">Time</span>
        <strong id="time-value">8:00 AM</strong>
      </div>
      <div class="hud-card">
        <span class="hud-label">Money</span>
        <strong id="money-value">$25</strong>
      </div>
      <div class="hud-card">
        <span class="hud-label">Pumpkins</span>
        <strong id="pumpkin-value">0</strong>
      </div>
    </section>

    <section id="message" class="message" role="status"></section>

    <section class="controls" aria-label="Controls">
      <div class="desktop-controls">Move: WASD / Arrow Keys &nbsp; • &nbsp; Interact: E</div>
      <div class="mobile-controls" aria-hidden="true">
        <button data-dir="up" class="control up">Up</button>
        <div class="control-row">
          <button data-dir="left" class="control">Left</button>
          <button data-dir="down" class="control">Down</button>
          <button data-dir="right" class="control">Right</button>
        </div>
      </div>
    </section>

    <div id="interact-hint" class="interact-hint">Press E to interact</div>
  </main>

  <script src="game.js"></script>
</body>
</html>
