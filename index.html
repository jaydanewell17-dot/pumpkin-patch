<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OCTOBER</title><style>
:root{--g:#475e4d;--b:#705e49;--cream:#eee7d9;--paper:#f7f1e5;--ink:#302d27;--muted:#81776a;--line:#d2c7b6;--red:#855b4d}*{box-sizing:border-box}body{margin:0;background:#252822;color:var(--ink);font-family:Georgia,serif}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--paper);position:relative;overflow:hidden}.leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.leaf{position:absolute;width:11px;height:17px;background:var(--b);border-radius:100% 0;opacity:.65;animation:fall 6s linear infinite}@keyframes fall{from{transform:translateY(-25px) rotate(0)}to{transform:translate(55px,75px) rotate(250deg)}}.leaf:nth-child(1){left:8%;animation-delay:-1s}.leaf:nth-child(2){left:31%;animation-delay:-4s}.leaf:nth-child(3){left:57%;animation-delay:-2s}.leaf:nth-child(4){left:78%;animation-delay:-5s}.leaf:nth-child(5){left:91%;animation-delay:-3s}.screen{min-height:100vh;padding:22px 18px 30px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.brand{font-size:24px;letter-spacing:4px;color:var(--g)}.date{font-size:12px;color:var(--muted);text-align:right}.weather{margin-top:18px;padding:17px;background:#e4ddcf;border:1px solid var(--line);border-radius:4px}.weather b{font-size:18px}.sub{color:var(--muted);font-size:13px;margin-top:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.stat{background:white;border:1px solid var(--line);padding:11px;border-radius:4px}.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px}.bar{height:5px;background:#ddd4c7;margin-top:7px;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}.money{background:var(--g);color:white;padding:12px;border-radius:4px;margin-bottom:14px}.scene{background:#e8dfd1;border:1px solid var(--line);padding:20px 17px;min-height:225px;position:relative;overflow:hidden}.scene:before{content:"";position:absolute;right:18px;top:18px;width:68px;height:68px;background:#d7c8b4;border:7px solid #9b8d78;box-shadow:inset 0 0 0 4px #d9d1c4}.pumpkin{width:42px;height:32px;border-radius:48%;background:#806e58;position:absolute;box-shadow:inset 8px 0 #705e49,inset -8px 0 #93836e;right:31px;bottom:28px}.pumpkin:before{content:"";position:absolute;width:7px;height:9px;background:#475e4d;left:18px;top:-7px;border-radius:3px}.pumpkin.big{width:54px;height:40px}.pumpkin.small{width:31px;height:24px}.time{font-size:12px;color:var(--muted);letter-spacing:1px}.scene h2{font-size:23px;font-weight:normal;margin:9px 0 8px;max-width:75%}.scene p{line-height:1.55;max-width:78%;margin:0;color:#4e493f}.actions{margin-top:14px;display:grid;gap:8px}.btn{border:1px solid var(--g);background:transparent;color:var(--g);padding:13px;text-align:left;font:inherit;border-radius:3px}.btn.primary{background:var(--g);color:white}.btn:active{transform:translateY(1px)}.nav{position:sticky;bottom:0;background:rgba(247,241,229,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 0 4px;z-index:10}.nav button{background:none;border:0;color:var(--muted);font:11px Georgia;padding:7px 2px}.nav button.active{color:var(--g);font-weight:bold}.panel{margin-top:15px}.card{background:white;border:1px solid var(--line);padding:14px;margin-bottom:9px;border-radius:4px}.card h3{font-size:16px;margin:0 0 6px;font-weight:normal}.card p{font-size:13px;line-height:1.5;margin:0;color:#625b50}.choice{margin-top:9px;width:100%;padding:11px;background:#f3ede2;border:1px solid var(--line);text-align:left;font:13px Georgia;color:var(--ink)}.hidden{display:none!important}.start{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;position:relative}.start h1{font-size:62px;letter-spacing:10px;font-weight:normal;color:var(--g);margin:0}.start p{color:var(--muted);line-height:1.6}.start button{margin-top:20px;background:var(--g);color:white;border:0;padding:15px 30px;font:inherit;letter-spacing:2px}.start .pumpkin{position:absolute;right:20%;bottom:22%;}.start .pumpkin.two{right:auto;left:18%;bottom:29%}.event{border-left:3px solid var(--b);padding-left:12px;margin:13px 0;color:#514a40;font-size:13px;line-height:1.5}.tiny{font-size:11px;color:var(--muted)}
</style></head><body><div class="app"><div class="leaves"><span class="leaf"></span><span class="leaf"></span><span class="leaf"></span><span class="leaf"></span><span class="leaf"></span></div><div id="start" class="start"><div><div class="pumpkin"></div><div class="pumpkin two small"></div><h1>OCTOBER</h1><p>A small life, lived one autumn day at a time.</p><button onclick="startGame()">BEGIN</button></div></div><main id="game" class="hidden"><section class="screen"><header class="top"><div class="brand">OCTOBER</div><div class="date" id="date"></div></header><div class="weather"><b id="weather"></b><div class="sub" id="weatherSub"></div></div><div class="stats" id="stats"></div><div class="money" id="money"></div><div class="scene"><div class="time" id="time"></div><h2 id="title"></h2><p id="story"></p><div class="actions" id="actions"></div></div><div class="panel" id="panel"></div></section><nav class="nav"><button class="active" onclick="tab('day',this)">DAY</button><button onclick="tab('life',this)">LIFE</button><button onclick="tab('phone',this)">PHONE</button><button onclick="tab('journal',this)">JOURNAL</button></nav></main></div><script>
const S={day:1,month:9,year:2026,hour:8,minute:10,money:320,happy:72,health:90,energy:84,smart:62,social:55,job:null,partner:null,friends:2,items:[],history:[],acted:false,started:false,tab:'day'};
const months=['September','October','November','December'];const weather=['Crisp and clear','Light rain','Cloudy','Cold and bright','Windy','Drizzly'];
function startGame(){S.started=true;S.history.push('September 1 — You began a new chapter in Maplewood.');document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}
function dateText(){return `${months[S.month-9]} ${S.day}, ${S.year}`}
function stat(name,val){return `<div class="stat"><small>${name}</small><b>${val}%</b><div class="bar"><i style="width:${Math.max(0,Math.min(100,val))}%"></i></div></div>`}
function render(){document.getElementById('date').innerHTML=dateText();document.getElementById('weather').textContent=weather[(S.day+S.month)%weather.length];document.getElementById('weatherSub').textContent='Maplewood · fall season';document.getElementById('stats').innerHTML=stat('HAPPINESS',S.happy)+stat('HEALTH',S.health)+stat('ENERGY',S.energy)+stat('SMARTS',S.smart)+stat('SOCIAL',S.social);document.getElementById('money').textContent='$'+S.money.toLocaleString();document.getElementById('time').textContent=timeText();document.getElementById('panel').innerHTML='';
if(S.tab==='day')day();if(S.tab==='life')life();if(S.tab==='phone')phone();if(S.tab==='journal')journal();}
function timeText(){let h=S.hour%12||12;return `${h}:${String(S.minute).padStart(2,'0')} ${S.hour<12?'AM':'PM'}`}
function day(){let title='A quiet fall morning.';let story='The house is still. The window is cool to the touch, and the trees outside have started turning.';if(S.month===10&&S.day===31){title='Halloween.';story='The whole town feels different tonight. Porch lights glow, costumes fill the sidewalks, and everyone seems to have somewhere to be.'}document.getElementById('title').textContent=title;document.getElementById('story').textContent=story;let a=[];if(!S.acted){a=[['MAKE BREAKFAST',()=>act('breakfast')],['GET READY',()=>act('ready')],['CHECK PHONE',()=>{tab('phone');}],['GO OUTSIDE',()=>act('outside')]]}else{a=[['CONTINUE THE DAY',()=>advanceTime(3)],['GO TO SLEEP',()=>nextDay()]]}document.getElementById('actions').innerHTML=a.map(x=>`<button class="btn ${x[0]==='GO TO SLEEP'?'primary':''}" onclick="(${x[1].toString()})()">${x[0]}</button>`).join('');}
function act(type){S.acted=true; if(type==='breakfast'){S.health=Math.min(100,S.health+3);S.energy=Math.min(100,S.energy+8);S.hour=9;S.minute=5;S.history.push(`${dateText()} — Made breakfast at home.`)}if(type==='ready'){S.happy+=2;S.energy-=2;S.hour=9;S.minute=25;S.history.push(`${dateText()} — Got ready for the day.`)}if(type==='outside'){S.happy+=5;S.health+=1;S.energy-=6;S.hour=10;S.minute=0;S.history.push(`${dateText()} — Went outside and walked through the cold morning.`)}render()}
function advanceTime(n){S.hour+=n;if(S.hour>=13&&!S.acted2){S.acted2=true;S.acted=false;S.title='';S.history.push(`${dateText()} — The afternoon arrived.`)}render()}
function nextDay(){S.energy=Math.min(100,S.energy+22);S.happy=Math.max(0,Math.min(100,S.happy));S.health=Math.max(0,Math.min(100,S.health));S.smart=Math.max(0,Math.min(100,S.smart));S.social=Math.max(0,Math.min(100,S.social));S.day++;S.hour=8;S.minute=10;S.acted=false;S.acted2=false;if(S.day>30){S.day=1;S.month++;}if(S.month>12){S.month=9;S.year++;}S.history.push(`${dateText()} — A new day began.`);render()}
function tab(t,el){S.tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');render()}
function life(){document.getElementById('title').textContent='YOUR LIFE';document.getElementById('story').textContent='Your choices shape a life that changes slowly, one day at a time.';document.getElementById('actions').innerHTML='';document.getElementById('panel').innerHTML=`<div class="card"><h3>Current life</h3><p>Age 18 · Maplewood<br>School: High school graduate<br>Job: ${S.job||'Unemployed'}<br>Relationship: ${S.partner||'Single'}<br>Friends: ${S.friends}</p></div><div class="card"><h3>Things you own</h3><p>${S.items.length?S.items.join(', '):'Nothing notable yet.'}</p></div>`}
function phone(){document.getElementById('title').textContent='Your phone';document.getElementById('story').textContent='Nothing is waiting for you right now.';document.getElementById('actions').innerHTML=`<button class="btn" onclick="textFriend()">TEXT A FRIEND</button><button class="btn" onclick="weatherCall()">CHECK WEATHER</button>`}
function textFriend(){S.social=Math.min(100,S.social+5);S.happy=Math.min(100,S.happy+2);S.history.push(`${dateText()} — Texted a friend.`);S.tab='phone';render()}
function weatherCall(){S.history.push(`${dateText()} — Checked the weather: ${weather[(S.day+S.month)%weather.length]}.`);render()}
function journal(){document.getElementById('title').textContent='Journal';document.getElementById('story').textContent='Everything your life has recorded so far.';document.getElementById('actions').innerHTML='';document.getElementById('panel').innerHTML=S.history.slice().reverse().map(x=>`<div class="event">${x}</div>`).join('')}
</script></body></html>
