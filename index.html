<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pumpkin Season — Build 1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800&display=swap');
:root{
  --cream:#f3ead9; --paper:#f7efdf; --sage:#7f9177; --sage-deep:#5e7258;
  --brown:#684d3c; --espresso:#44362d; --mushroom:#b7a68e; --terracotta:#ae7256;
  --gold:#b58b58; --ink:#4c433b; --shadow:rgba(66,55,45,.20);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#c7c0af;color:var(--ink);font-family:Nunito,system-ui,sans-serif}
button{font:inherit}
#game{width:min(100%,980px);margin:0 auto;background:var(--cream);min-height:100vh;overflow:hidden;position:relative}
#scene{position:relative;width:100%;aspect-ratio:1200/760;min-height:500px;overflow:hidden;background:#aeb89f}
#scene>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#hud{position:absolute;z-index:30;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.hud-title{font:700 clamp(20px,3.2vw,31px) Fraunces,serif;color:var(--espresso);text-shadow:0 2px 0 rgba(255,250,238,.6)}
.hud-sub{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#66745f;font-weight:800}
.hud-card{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.hud-pill{min-width:76px;padding:8px 11px;border-radius:15px;background:url('assets/ui-paper.svg') center/cover;border:2px solid #cdbfa6;box-shadow:0 3px 0 rgba(104,77,60,.18);font-weight:800;color:var(--espresso);text-align:center}
.hud-pill .label{display:block;font-size:10px;letter-spacing:.09em;color:#7a715f;text-transform:uppercase}
.hud-pill .value{font-family:Fraunces,serif;font-size:17px}
#objects{position:absolute;inset:0;z-index:18}
.plot-art{position:absolute;z-index:7;width:10.8%;height:auto;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(50,43,36,.17))}.pa0{left:10.9%;top:62.9%}.pa1{left:21.4%;top:62.9%}.pa2{left:10.9%;top:75.7%}.pa3{left:21.4%;top:75.7%}
.world-object{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;filter:drop-shadow(0 4px 3px rgba(50,43,36,.18));transform-origin:center bottom;transition:transform .16s ease,filter .16s ease}
.world-object:hover{transform:translateY(-2px) scale(1.015)}
.world-object:active{transform:translateY(2px) scale(.985)}
.world-object:focus-visible{outline:3px solid #efe0b7;outline-offset:4px;border-radius:14px}
.world-object img{display:block;width:100%;height:auto;pointer-events:none}
.house{left:8%;top:31%;width:22%}.tree{left:34.5%;top:15%;width:11.5%}.well{left:49.5%;top:43%;width:9%}.shed{right:9%;top:58%;width:13.5%}.crate{right:23%;bottom:10%;width:8.5%}.seeds{left:43%;bottom:11%;width:6.2%}.watering{left:51%;bottom:9%;width:7%}.basket{right:8.5%;bottom:8%;width:7%}
.plot{position:absolute;z-index:13;border:0;background:transparent;padding:0;cursor:pointer;width:9%;height:10.4%;border-radius:15px}
.plot::after{content:"";position:absolute;inset:6%;border:2px dashed transparent;border-radius:13px;transition:border-color .15s,background .15s}
.plot[data-selected="true"]::after{border-color:#ead89f;background:rgba(244,229,177,.13)}
.p0{left:11.4%;top:63.2%}.p1{left:21.9%;top:63.2%}.p2{left:11.4%;top:76.1%}.p3{left:21.9%;top:76.1%}
.crop-sprite{position:absolute;z-index:15;width:6.7%;height:auto;display:none;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(57,45,36,.2))}
.c0{left:12.1%;top:62.0%}.c1{left:22.6%;top:62.0%}.c2{left:12.1%;top:74.9%}.c3{left:22.6%;top:74.9%}
#mode-badge{position:absolute;z-index:32;left:50%;top:68px;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:18px;background:url('assets/ui-paper.svg') center/cover;border:2px solid #cbbba1;box-shadow:0 3px 0 rgba(73,58,47,.16);font-size:13px;font-weight:800;color:var(--espresso);white-space:nowrap}
#mode-badge button{border:0;background:transparent;color:#7a5b48;cursor:pointer;padding:0 2px;font-weight:900}
#context{position:absolute;z-index:50;display:none;width:min(270px,calc(100% - 24px));background:url('assets/ui-paper.svg') center/cover;border:2px solid #c5b59d;border-radius:20px;padding:14px;box-shadow:0 8px 20px var(--shadow);}
#context .title{font:700 20px Fraunces,serif;color:var(--espresso)}
#context .desc{font-size:12px;line-height:1.45;color:#6d6459;margin:3px 0 10px}
.context-actions{display:flex;gap:8px;flex-wrap:wrap}.context-actions button{flex:1;min-width:105px;border:2px solid #6b7c62;border-radius:14px;padding:9px 11px;background:url('assets/ui-wood.svg') center/cover;color:#fff7e6;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(72,52,42,.3)}.context-actions button.alt{background:#e9dfcd;color:var(--espresso);border-color:#bcae99;box-shadow:0 3px 0 rgba(93,75,61,.18)}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;max-width:calc(100% - 28px);display:none;padding:9px 14px;border-radius:16px;background:rgba(66,54,45,.92);color:#fff4dd;text-align:center;font-size:13px;font-weight:800;box-shadow:0 5px 15px rgba(53,43,35,.24)}
#inventory-drawer{position:absolute;z-index:55;right:14px;bottom:14px;width:min(310px,calc(100% - 28px));display:none;background:url('assets/ui-paper.svg') center/cover;border:2px solid #c4b39b;border-radius:21px;padding:15px;box-shadow:0 10px 25px var(--shadow)}
.drawer-head{display:flex;align-items:center;justify-content:space-between}.drawer-head h2{margin:0;font:700 21px Fraunces,serif;color:var(--espresso)}.close{border:0;background:transparent;color:#725844;font-weight:900;font-size:18px;cursor:pointer}.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed #cdbfa7}.item img{width:42px;height:42px;object-fit:contain}.item strong{display:block}.item span{font-size:12px;color:#786e62}.ship{margin-top:9px;width:100%;border:2px solid #6b7d62;border-radius:14px;padding:10px;background:url('assets/ui-wood.svg') center/cover;color:#fff7e6;font-weight:800;cursor:pointer}
#selected-note{position:absolute;z-index:20;display:none;pointer-events:none;padding:5px 9px;border-radius:11px;background:rgba(247,239,223,.92);border:1px solid #c5b69d;font-size:11px;font-weight:800;color:#6a5a4b;box-shadow:0 2px 8px rgba(64,50,40,.13)}
@media(max-width:700px){#scene{min-height:410px}.hud-title{font-size:23px}.hud-sub{font-size:9px}.hud-pill{min-width:67px;padding:7px 8px}.hud-pill .value{font-size:15px}}
@media(max-width:520px){#scene{min-height:350px}.hud{top:8px}.hud-card{gap:5px}.hud-pill{min-width:58px;padding:6px}.hud-pill .label{font-size:8px}.hud-pill .value{font-size:13px}.house{left:7.3%;width:27%}.tree{width:13%}.well{width:11%}.shed{width:15.5%}}
@media(prefers-reduced-motion:reduce){.world-object{transition:none}}
</style>
</head>
<body>
<main id="game">
 <section id="scene" aria-label="Pumpkin Season farm">
  <img class="bg" src="assets/background.svg" alt="Hand-painted autumn farm landscape">
  <div id="hud">
   <div><div class="hud-title">Pumpkin Season</div><div class="hud-sub" id="dateLabel">September 1 · Morning</div></div>
   <div class="hud-card">
    <div class="hud-pill"><span class="label">Day</span><span class="value" id="day">1</span></div>
    <div class="hud-pill"><span class="label">Energy</span><span class="value" id="energy">8 / 8</span></div>
    <div class="hud-pill"><span class="label">Coins</span><span class="value" id="coins">30</span></div>
    <div class="hud-pill"><span class="label">Pumpkins</span><span class="value" id="pumpkins">0</span></div>
   </div>
  </div>
  <div id="mode-badge"><span id="mode-text"></span><button type="button" id="cancel-mode" aria-label="Cancel mode">×</button></div>
  <div id="plots-art">
   <img class="plot-art pa0" src="assets/plot.svg" alt=""><img class="plot-art pa1" src="assets/plot.svg" alt="">
   <img class="plot-art pa2" src="assets/plot.svg" alt=""><img class="plot-art pa3" src="assets/plot.svg" alt="">
  </div>
  <div id="objects">
   <button class="world-object house" data-object="house" aria-label="Farmhouse"><img src="assets/house.svg" alt=""></button>
   <button class="world-object tree" data-object="tree" aria-label="Autumn tree"><img src="assets/tree.svg" alt=""></button>
   <button class="world-object well" data-object="well" aria-label="Stone well"><img src="assets/well.svg" alt=""></button>
   <button class="world-object shed" data-object="shed" aria-label="Garden shed"><img src="assets/shed.svg" alt=""></button>
   <button class="world-object crate" data-object="crate" aria-label="Shipping crate"><img src="assets/crate.svg" alt=""></button>
   <button class="world-object seeds" data-object="seeds" aria-label="Pumpkin seed bag"><img src="assets/seeds.svg" alt=""></button>
   <button class="world-object watering" data-object="watering" aria-label="Watering can"><img src="assets/watering.svg" alt=""></button>
   <button class="world-object basket" data-object="basket" aria-label="Harvest basket"><img src="assets/basket.svg" alt=""></button>
  </div>
  <button class="plot p0" data-plot="0" aria-label="Garden plot 1"></button>
  <button class="plot p1" data-plot="1" aria-label="Garden plot 2"></button>
  <button class="plot p2" data-plot="2" aria-label="Garden plot 3"></button>
  <button class="plot p3" data-plot="3" aria-label="Garden plot 4"></button>
  <img class="crop-sprite c0" id="crop0" alt=""><img class="crop-sprite c1" id="crop1" alt=""><img class="crop-sprite c2" id="crop2" alt=""><img class="crop-sprite c3" id="crop3" alt="">
  <div id="selected-note"></div>
  <div id="context" aria-live="polite"><div class="title" id="contextTitle"></div><div class="desc" id="contextDesc"></div><div class="context-actions" id="contextActions"></div></div>
  <div id="inventory-drawer"></div>
  <div id="toast" aria-live="polite"></div>
 </section>
</main>
<script>
(() => {
  const plots=[0,1,2,3].map(()=>({stage:0,watered:false}));
  const state={day:1,energy:8,coins:30,seeds:6,pumpkins:0,mode:null,selected:0};
  const cropFiles=['','assets/sprout.svg','assets/vine.svg','assets/pumpkin-small.svg','assets/pumpkin.svg'];
  const scene=document.getElementById('scene');
  const dayEl=document.getElementById('day'), energyEl=document.getElementById('energy'), coinsEl=document.getElementById('coins'), pumpkinsEl=document.getElementById('pumpkins'), dateLabel=document.getElementById('dateLabel');
  const modeBadge=document.getElementById('mode-badge'), modeText=document.getElementById('mode-text');
  const context=document.getElementById('context'), contextTitle=document.getElementById('contextTitle'), contextDesc=document.getElementById('contextDesc'), contextActions=document.getElementById('contextActions');
  const drawer=document.getElementById('inventory-drawer'), toast=document.getElementById('toast');
  const plotBtns=[...document.querySelectorAll('.plot')], crops=[0,1,2,3].map(i=>document.getElementById('crop'+i));
  let toastTimer=null;
  function render(){
    dayEl.textContent=state.day; energyEl.textContent=state.energy+' / 8'; coinsEl.textContent=state.coins; pumpkinsEl.textContent=state.pumpkins;
    dateLabel.textContent='September '+(state.day)+' · '+(state.energy===8?'Morning':'Afternoon');
    plots.forEach((p,i)=>{
      plotBtns[i].dataset.selected=(state.selected===i?'true':'false');
      const c=crops[i]; c.style.display=p.stage?'block':'none'; if(p.stage)c.src=cropFiles[p.stage];
      c.style.opacity=p.watered && p.stage<4?.88:1;
    });
    modeBadge.style.display=state.mode?'flex':'none'; modeText.textContent=state.mode==='plant'?'Planting pumpkin seeds':'Watering crops';
  }
  function showToast(msg){clearTimeout(toastTimer);toast.textContent=msg;toast.style.display='block';toastTimer=setTimeout(()=>toast.style.display='none',2200)}
  function closeContext(){context.style.display='none';contextActions.innerHTML=''}
  function setMode(mode){state.mode=state.mode===mode?null:mode;closeContext();render();showToast(state.mode?(state.mode==='plant'?'Choose an empty garden plot.':'Tap a growing crop to water it.'):'Tool put away.')} 
  document.getElementById('cancel-mode').addEventListener('click',()=>setMode(null));
  function addAction(label,fn,alt=false){const b=document.createElement('button');b.type='button';b.textContent=label;if(alt)b.className='alt';b.addEventListener('click',fn);contextActions.appendChild(b)}
  function openContext(title,desc,x,y,actions){
    contextTitle.textContent=title;contextDesc.textContent=desc;contextActions.innerHTML=''; actions.forEach(a=>addAction(a.label,a.fn,a.alt));
    context.style.display='block'; const r=scene.getBoundingClientRect(); let left=x-r.left, top=y-r.top;
    const w=Math.min(270,r.width-24), h=125; left=Math.max(12,Math.min(left-w/2,r.width-w-12)); top=Math.max(88,Math.min(top-h-12,r.height-h-12)); context.style.left=left+'px'; context.style.top=top+'px';
  }
  document.querySelectorAll('.world-object').forEach(obj=>obj.addEventListener('click',e=>{
    const type=obj.dataset.object, rect=obj.getBoundingClientRect(), x=rect.left+rect.width/2, y=rect.top+rect.height/2;
    if(type==='seeds'){
      openContext('Pumpkin seeds',state.seeds+' seeds tucked in the bag.',x,y,[]);
      if(state.seeds>0)addAction('Start planting',()=>setMode('plant'));
      addAction('Leave it',closeContext,true); return;
    }
    if(type==='watering'){
      openContext('Watering can','The well is full. Watering costs 1 energy per crop.',x,y,[]);
      addAction('Start watering',()=>setMode('water')); addAction('Leave it',closeContext,true); return;
    }
    if(type==='basket'){
      openContext('Harvest basket',state.pumpkins+' mature pumpkin'+(state.pumpkins===1?'':'s')+' ready to ship.',x,y,[]);
      addAction('Open basket',()=>openInventory(),); addAction('Close',closeContext,true); return;
    }
    if(type==='crate'){
      openContext('Shipping crate',state.pumpkins?state.pumpkins+' pumpkin'+(state.pumpkins===1?'':'s')+' can be shipped for 8 coins each.':'The crate is empty. Harvest pumpkins first.',x,y,[{label:state.pumpkins?'Ship pumpkins':'Close',fn:state.pumpkins?shipAll:closeContext,alt:!state.pumpkins}]); return;
    }
    if(type==='house'){
      openContext('Farmhouse','A quiet little place to end the day.',x,y,[{label:'Sleep until tomorrow',fn:nextDay},{label:'Not yet',fn:closeContext,alt:true}]); return;
    }
    if(type==='well'){openContext('Stone well','Clear, cold water for the farm. It restores your watering can every morning.',x,y,[{label:'Close',fn:closeContext,alt:true}]);return}
    if(type==='shed'){openContext('Garden shed','Tools and supplies will live here as the farm grows.',x,y,[{label:'Close',fn:closeContext,alt:true}]);return}
    if(type==='tree'){openContext('Old maple tree','A few leaves drift down whenever the wind picks up.',x,y,[{label:'Close',fn:closeContext,alt:true}]);}
  }));
  document.querySelectorAll('.seeds').forEach(()=>{});
  plotBtns.forEach((btn,i)=>btn.addEventListener('click',e=>{
    state.selected=i;render(); const p=plots[i]; const rect=btn.getBoundingClientRect();
    if(p.stage>=4){ if(state.energy<1){showToast('You are out of energy for today.');return} state.energy--; p.stage=0;p.watered=false;state.pumpkins++;showToast('Pumpkin harvested. It is sitting in your basket.');render();return; }
    if(state.mode==='plant'){
      if(p.stage){showToast('Something is already growing here.');return}
      if(state.seeds<=0){showToast('Your seed bag is empty.');setMode(null);return}
      if(state.energy<1){showToast('You are too tired to plant more today.');return}
      state.seeds--;state.energy--;p.stage=1;p.watered=false;showToast('Pumpkin seed planted. Give it water.');render();return;
    }
    if(state.mode==='water'){
      if(!p.stage){showToast('There is nothing planted here.');return}
      if(p.watered){showToast('This crop is already watered.');return}
      if(state.energy<1){showToast('You are too tired to water more today.');return}
      state.energy--;p.watered=true;showToast('The soil is damp and the pumpkin can grow.');render();return;
    }
    if(!p.stage){openContext('Empty garden plot','It is ready for a seed. Tap your seed bag first.',rect.left+rect.width/2,rect.top+rect.height/2,[{label:'Close',fn:closeContext,alt:true}]);return}
    openContext(p.watered?'Growing pumpkin':'Needs water',p.watered?'This crop is cared for today.':'Use the watering can, then tap this plot.',rect.left+rect.width/2,rect.top+rect.height/2,[{label:'Close',fn:closeContext,alt:true}]);
  }));
  function openInventory(){closeContext();drawer.style.display='block';drawer.innerHTML='<div class="drawer-head"><h2>Farm basket</h2><button class="close" type="button" aria-label="Close">×</button></div><div class="item"><img src="assets/pumpkin.svg" alt=""><div><strong>Pumpkins × '+state.pumpkins+'</strong><span>Fresh from today\'s harvest</span></div></div><div class="item"><img src="assets/seeds.svg" alt=""><div><strong>Pumpkin seeds × '+state.seeds+'</strong><span>Plant these in an empty plot</span></div></div><button class="ship" type="button">Ship pumpkins</button>';
    drawer.querySelector('.close').addEventListener('click',()=>drawer.style.display='none');drawer.querySelector('.ship').addEventListener('click',shipAll);
  }
  function shipAll(){if(!state.pumpkins){showToast('Nothing to ship yet.');drawer.style.display='none';closeContext();return} const earned=state.pumpkins*8;const count=state.pumpkins;state.coins+=earned;state.pumpkins=0;drawer.style.display='none';closeContext();showToast('Shipped '+count+' pumpkin'+(count===1?'':'s')+'. +'+earned+' coins.');render()}
  function nextDay(){
    closeContext();drawer.style.display='none';let grew=0,withWater=0;plots.forEach(p=>{if(p.stage){if(p.watered){p.stage=Math.min(4,p.stage+1);grew++;withWater++}p.watered=false}});state.day++;state.energy=8;setMode(null);render();showToast(withWater?'A new morning. Your watered crops grew overnight.':'A new morning. The farm is waiting for you.');
  }
  render();
})();
</script>
</body>
</html>
